# MUGA Landing — Cloudflare Worker config.
#
# Deploys landing/index.html (and any sibling static assets we add later)
# to the existing "muga-landing" Worker via Workers Static Assets binding.
# The Worker's custom domain (muga.app) is configured in the Cloudflare
# dashboard and is intentionally NOT redeclared here — `wrangler deploy`
# updates the script + assets for the existing Worker without touching
# its triggers, so the live custom-domain binding stays untouched even
# during the first deploy from this repo.
#
# Auth: deploy needs a CLOUDFLARE_API_TOKEN secret in the GitHub repo
# (Workers Edit scope). See docs/ops/landing-deploy.md.

name = "muga-landing"
compatibility_date = "2026-05-24"
main = "landing-worker/worker.js"

[assets]
directory = "./landing"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker for every request (including static-asset hits) so the
# landing Worker's response transforms actually apply. Without this, Static
# Assets serves files directly and the Worker is never invoked, so its
# SECURITY_HEADERS and the Cache-Control revalidation policy (cacheControlFor)
# silently never reach the browser. The Worker still serves bytes via
# env.ASSETS.fetch(); this only inserts it into the request path.
run_worker_first = true
