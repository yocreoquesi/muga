<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — MUGA</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">

<link rel="icon" href="https://rules.muga.app/assets/muga-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --bg: #0E0C13;
    --ink: #F2EFF7;
    --ink-2: #A9A2B8;
    --ink-3: #8C84A2;
    --rule: #2A2536;
    --accent: #6A2BCF;
    --accent-ink: #A883F0;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #C9B2F5; text-underline-offset: 3px; }
  a:hover { color: #E4D8FA; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 28px; width: 100%; }
  .eyebrow {
    display: flex; align-items: center; gap: 10px; margin: 0 0 22px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent-ink);
  }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--accent); flex: none; }
  h1 {
    margin: 0 0 20px;
    font-size: clamp(36px, 5vw, 60px);
    line-height: .98; letter-spacing: -.035em; font-weight: 800;
    max-width: 17ch; text-wrap: balance;
  }
  h1 .mark { color: var(--accent-ink); }
  p {
    margin: 0 0 30px; font-size: 17px; line-height: 1.6;
    color: var(--ink-2); max-width: 46ch; text-wrap: pretty;
  }
  .ways { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-family: inherit; border: 0; cursor: pointer;
    font-weight: 600; font-size: 15.5px; padding: 14px 24px; border-radius: 10px;
  }
  .btn:hover { background: #7B3FE0; color: #fff; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid #332C42; }
  .sig { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .sig svg { display: block; width: 190px; height: auto; color: var(--accent-ink); }
  .sig .cap {
    margin-top: 12px; font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .04em; color: var(--ink-3);
  }
</style>
</head>
<body>

<main class="wrap">
  <p class="eyebrow">Error 404</p>

  <h1>That link went <span class="mark">nowhere.</span></h1>

  <p>
    No page lives at this address. If you followed a link from somewhere else it may have moved,
    or the address picked up a stray character on the way here.
  </p>

  <div class="ways">
    <a class="btn" href="/">Back to muga.app</a>
    <a class="btn ghost" href="/clean/">Clean a link instead</a>
  </div>

  <div class="sig">
    <svg viewBox="0 0 104 68" fill="none" aria-hidden="true">
      <path d="M 12 56 C 12 8, 46 8, 52 46 L 62 22 L 72 50 L 84 50" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 80 37 L 98 50 L 80 63 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <p class="cap">muga &#8776; Making URLs Good Again.</p>
  </div>
</main>

</body>
</html>
