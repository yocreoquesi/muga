name: Release

# Triggered when a version tag is pushed: git tag v1.0.0 && git push --tags
# Also supports manual dispatch: some main commits use [skip ci] in their
# message (e.g. the publish-rules.yml auto-commit) and GitHub honors that
# token on tag pushes when the tag points to such a commit, suppressing
# this workflow. workflow_dispatch gives ops a reliable manual trigger
# that takes a tag name input.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v1.10.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Get version from tag
        id: version
        run: |
          # For push events, GITHUB_REF_NAME is the tag (v1.2.3); for
          # workflow_dispatch, read from the input.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Rename build artifacts
        run: |
          mv dist/chrome/*.zip dist/chrome/muga-${{ steps.version.outputs.VERSION }}-chrome.zip
          mv dist/firefox/*.zip dist/firefox/muga-${{ steps.version.outputs.VERSION }}-firefox.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          # Explicit tag_name lets the action work under workflow_dispatch,
          # where github.ref is the branch (e.g. refs/heads/main), not a tag.
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            See [CHANGELOG.md](https://github.com/yocreoquesi/muga/blob/main/CHANGELOG.md) for what changed in this release.

            ## Install from source
            Download the `.zip` for your browser, unpack, and load as an unpacked extension.
            - **Chrome**: `chrome://extensions` → Developer mode → Load unpacked
            - **Firefox**: `about:debugging` → Load Temporary Add-on
          files: |
            dist/chrome/muga-${{ steps.version.outputs.VERSION }}-chrome.zip
            dist/firefox/muga-${{ steps.version.outputs.VERSION }}-firefox.zip
          draft: false
          prerelease: false

      # ── Firefox AMO submission ──────────────────────────────────────
      - name: Prepare source code archive for AMO
        run: git archive --format=zip --prefix=muga-source/ HEAD -o muga-source.zip

      - name: Inject release notes into AMO metadata
        run: bash scripts/prepare-amo-metadata.sh "${{ steps.version.outputs.VERSION }}"

      - name: Submit to Firefox AMO
        id: amo
        continue-on-error: true
        run: |
          # Capture stdout+stderr so the gate below can distinguish a benign
          # "version already submitted" response (re-run of an existing tag)
          # from a real failure (auth, network, schema). web-ext sign exits
          # non-zero in both cases — only the message tells us which.
          set +e
          OUTPUT=$(bash scripts/with-firefox-manifest.sh \
            npx web-ext sign \
              --source-dir=src/ \
              --channel=listed \
              --amo-metadata=amo-metadata.json \
              --upload-source-code=muga-source.zip \
              --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
              --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
              --approval-timeout=0 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          # AMO returns variants of "version already used / submitted / signed"
          # when the same version was uploaded on a previous run. Treat as no-op
          # so a tag re-run after a partial failure does not flag a fake error.
          if echo "$OUTPUT" | grep -qiE "already (been )?(signed|submitted|uploaded|used|exists)|version (conflict|is taken|number .* is the same)|HTTP ?409"; then
            echo "result=noop" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO reports this version was already submitted — treating as no-op"
            exit 0
          fi
          echo "result=$([ $EXIT -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
          exit $EXIT

      # ── Chrome Web Store submission ─────────────────────────────────
      # CWS API does not support release notes — changelog is in the
      # GitHub Release body and CHANGELOG.md for transparency.
      - name: Get CWS access token
        id: cws-token
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$RESPONSE" | node -e "process.stdin.on('data',d=>{const t=JSON.parse(d).access_token;if(!t){console.error('Failed to get token:',d.toString());process.exit(1);}console.log(t);})")
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        id: cws-upload
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${{ steps.cws-token.outputs.TOKEN }}" \
            -H "x-goog-api-version: 2" \
            -T "dist/chrome/muga-${{ steps.version.outputs.VERSION }}-chrome.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          # CWS returns a JSON body containing an `itemError` array on failure.
          # When the version was uploaded by a previous run, the body marks the
          # version as already published (e.g. ITEM_NOT_UPDATABLE / "version
          # ... is the same as the latest"). Treat as no-op for tag re-runs.
          if echo "$BODY" | grep -qiE "ITEM_NOT_UPDATABLE|version.*(is the same|already (uploaded|exists|published))|cannot.*update.*same version"; then
            echo "result=noop" >> "$GITHUB_OUTPUT"
            echo "::notice::CWS reports this version was already uploaded — treating as no-op"
            exit 0
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::CWS upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Publish on Chrome Web Store
        # Skip when the upload step decided the version was already in CWS
        # (no-op path) — there is nothing new to publish.
        if: steps.cws-upload.outputs.result == 'success'
        id: cws-publish
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ steps.cws-token.outputs.TOKEN }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}/publish")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::CWS publish failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"

      # ── Submission summary ──────────────────────────────────────────
      # Fail only when a store reports a REAL error. Each store step now
      # publishes a `result` output of `success | noop | failure`:
      #   - success — store accepted the new version
      #   - noop    — store reports this version is already submitted
      #               (typically a re-run of the same tag after a partial
      #               failure on the OTHER store)
      #   - failure — auth / schema / network / quota error
      # A "noop" outcome is treated as success-or-no-op so a tag re-run after
      # a partial failure does not flag the already-published store as broken.
      # The original "fail only if both failed" gate (pre v1.13.0) masked the
      # real AMO failure on v1.13.0; this gate is strict on real failures and
      # tolerant only of the explicit "version already submitted" path.
      - name: Check store submissions
        if: always()
        run: |
          AMO="${{ steps.amo.outputs.result || steps.amo.outcome }}"
          CWS_UP="${{ steps.cws-upload.outputs.result || steps.cws-upload.outcome }}"
          # cws-publish is skipped (and emits no `result`) when the upload
          # step went the noop path. Treat skipped-after-noop as noop too.
          if [ "${{ steps.cws-upload.outputs.result }}" = "noop" ]; then
            CWS_PUB="noop"
          else
            CWS_PUB="${{ steps.cws-publish.outputs.result || steps.cws-publish.outcome }}"
          fi
          {
            echo "## Store submission results"
            echo "- AMO: ${AMO}"
            echo "- CWS upload: ${CWS_UP}"
            echo "- CWS publish: ${CWS_PUB}"
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED=0
          if [ "$AMO" = "failure" ]; then
            echo "::error::AMO submission failed — see 'Submit to Firefox AMO' step"
            FAILED=1
          fi
          if [ "$CWS_UP" = "failure" ]; then
            echo "::error::CWS upload failed — see 'Upload to Chrome Web Store' step"
            FAILED=1
          fi
          if [ "$CWS_PUB" = "failure" ]; then
            echo "::error::CWS publish failed — see 'Publish on Chrome Web Store' step"
            FAILED=1
          fi
          [ "$FAILED" -eq 1 ] && exit 1
          echo "All store submissions succeeded (success or no-op)"
