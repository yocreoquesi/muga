name: Import upstream tracking params

# ── The global path is closed to this report (#1303) ────────────────────────
#
# This workflow diffs AdGuard Filter 17 against MUGA's global strip list and
# opens a PR with whatever it does not already carry. It is a MEASUREMENT. It
# is not, and must not become, a landing path.
#
# MUGA's global strip rule has no `urlFilter` (#1217), so a param appended to
# `TRACKING_PARAMS` is stripped on every site. The 2026-09-01 run measured what
# that costs for this report's own output (#1303): of 1441 candidates, 100 are
# two characters or shorter and 22 collide with common functional names — `q`,
# `query`, `page`, `id`, `type`, `s`, `t`, `u`, `from`, `ref`, `source`.
# Stripping `q` globally breaks search on much of the web; `u` is the exact
# param behind the ShareASale incident that turned `main` red for four PRs.
# Two more, `at` and `ref`, are Apple's and Vercel's affiliate tokens.
#
# The landing path for this source already exists and is not here. The weekly
# `auto-ingest-rules.yml` run feeds the same filter through
# `tools/rule-ingestion/`, whose AdGuard adapter forwards each fact AT THE HOST
# UPSTREAM ANCHORED IT TO (#1229) and puts it through the gate stack rather than
# through a human. Import at the anchor, never widen — that is what makes 1441
# facts tractable, and it is why the reviewer checklist below no longer asks
# anyone to append anything.

on:
  # On demand only (#1303). This used to run weekly, then monthly, on the
  # premise that a human would triage the backlog into the global list. That
  # premise is retired: the global path is closed to these candidates, and the
  # weekly host-anchored pipeline lands this same source without them. A
  # recurring PR whose only correct resolution is "close it" is noise, and the
  # report is reproducible whenever the coverage number is actually wanted.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Concurrency: only one importer in flight; queued, no cancellation.
concurrency:
  group: import-upstream
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch upstream and diff
        id: diff
        run: |
          set -eo pipefail
          IMPORT_REPORT_PATH="$GITHUB_WORKSPACE/import-report.json" \
            node tools/import-upstream.mjs
          COUNT=$(jq -r '.new_candidates_count' "$GITHUB_WORKSPACE/import-report.json")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Candidates discovered: $COUNT"

      - name: Exit early if no new candidates
        if: steps.diff.outputs.count == '0'
        run: echo "No new candidates from upstream this month. Exiting cleanly."

      - name: Configure git for the bot commit
        if: steps.diff.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit candidates
        if: steps.diff.outputs.count != '0'
        id: branch
        run: |
          set -eo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto-import/$DATE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # If a branch from a previous failed run exists, recreate from main.
          git checkout -B "$BRANCH"

          mkdir -p tools/import-candidates
          cp "$GITHUB_WORKSPACE/import-report.json" "tools/import-candidates/report-$DATE.json"

          git add tools/import-candidates/
          COUNT=${{ steps.diff.outputs.count }}
          git commit -m "auto-import: $COUNT tracking-param candidates from AdGuard Filter 17 ($DATE)"
          git push -u origin "$BRANCH" --force-with-lease

      - name: Open or update pull request
        if: steps.diff.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          DATE="${{ steps.branch.outputs.date }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          COUNT="${{ steps.diff.outputs.count }}"
          REPORT="$GITHUB_WORKSPACE/import-report.json"

          # Build the candidate list as a markdown bulleted block.
          CANDIDATES=$(jq -r '.new_candidates[] | "- `" + . + "`"' "$REPORT")

          BODY=$(cat <<EOF
          On-demand diff against [AdGuard URL Tracking Protection (Filter 17)](https://filters.adtidy.org/extension/chromium/filters/17.txt).

          **Source:** AdGuard Filter 17
          **Fetched at:** $(jq -r '.fetched_at' "$REPORT")
          **Params in upstream:** $(jq -r '.total_in_source' "$REPORT")
          **Params in MUGA:** $(jq -r '.total_in_muga' "$REPORT")
          **New candidates (not in MUGA):** $COUNT

          ## Candidates

          $CANDIDATES

          ## What to do with this

          **Nothing in this PR lands a param, and nothing in it should.** It is a
          measurement of the gap between upstream and MUGA's *global* strip list.

          The global strip rule has no \`urlFilter\` (#1217): anything appended to
          \`TRACKING_PARAMS\` is stripped on every site. Against this report's own
          output that is not a theoretical cost (#1303) — of the 2026-09-01 run's
          1441 candidates, 100 were two characters or shorter and 22 collided with
          common functional names (\`q\`, \`query\`, \`page\`, \`id\`, \`type\`, \`s\`,
          \`t\`, \`u\`, \`from\`, \`ref\`, \`source\`). \`u\` is the param behind the
          ShareASale incident; \`at\` and \`ref\` are Apple's and Vercel's affiliate
          tokens. **The global path is closed to this backlog.**

          Where these facts actually land: the weekly \`auto-ingest-rules.yml\` run
          feeds the same AdGuard Filter 17 through \`tools/rule-ingestion/\`, which
          takes each fact **at the host upstream anchored it to** (#1229) and runs
          it through the gate stack. That path needs no triage here.

          - [ ] Read the numbers below as a coverage signal, nothing more
          - [ ] Do **NOT** append any candidate to \`TRACKING_PARAMS\` / \`src/rules/tracking-params.json\`
          - [ ] If a candidate looks worth landing, land it **host-anchored** via the ingestion pipeline, not here
          - [ ] Close this PR and delete \`tools/import-candidates/report-$DATE.json\`; the report is reproducible with \`workflow_dispatch\`

          **DO NOT auto-merge**, and do not merge manually either: merging commits
          an archival artefact that then has to be removed again (#1261).

          The raw import report is on this branch at
          \`tools/import-candidates/report-$DATE.json\` if you want to read it
          without checking anything out.
          EOF
          )

          # Write body to a temp file to avoid shell-injection via $BODY/$CANDIDATES.
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"

          # Re-use existing PR if one is already open against this branch.
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "[auto-import] $COUNT tracking-param candidates from AdGuard Filter 17 ($DATE)" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "[auto-import] $COUNT tracking-param candidates from AdGuard Filter 17 ($DATE)" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "needs-triage,category:ops"
          fi
