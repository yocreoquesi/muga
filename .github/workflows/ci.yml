name: CI

# Run tests on every pull request to main and on every push to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile rules artifacts (#626)
        run: npm run compile:rules

      - name: Check src/rules/ is up to date (#626)
        # Asserts every generated rules artifact matches its committed form.
        # Covers tracking-params.json, rules-manifest.json, and any future
        # files the generator emits. The manifest is byte-deterministic — no
        # timestamps or SHAs — so a clean diff is achievable.
        run: |
          if ! git diff --exit-code -- src/rules/; then
            echo "ERROR: src/rules/ artifacts are out of sync with their source."
            echo "Run 'npm run compile:rules' locally and commit the resulting changes."
            exit 1
          fi

      - name: Bundle content script (#356)
        run: npm run build:content

      - name: Check content bundle is up to date
        run: |
          if ! git diff --exit-code src/content/cleaner-bundle.js; then
            echo "ERROR: cleaner-bundle.js is out of sync with its source. Run 'npm run build:content' and commit the result."
            exit 1
          fi

      - name: Verify browser-polyfill integrity (#97)
        run: node tools/verify-polyfill-integrity.mjs

      - name: Check i18n quality (no FIXME / stubs / empty locale slots) (#621)
        run: npm run check:i18n

      - name: Run unit tests
        run: npm test

      - name: Run integration tests against live Worker (#608)
        # Hits unwrap.muga.app to verify the extension-Worker contract
        # (path, param shape, Origin gate, signed-envelope verifiability).
        # Catches contract drift that the unit-level fetch stubs cannot —
        # specifically the v1.15.1 hotfix class of bugs.
        # If transient flakiness becomes a problem, investigate the Worker
        # availability rather than disabling — stub coverage already exists.
        run: npm run test:integration

      - name: CAPS-Contextual conformance gate (#543)
        run: npm run conformance:contextual

      - name: Lint extension
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bundle content script (#356)
        run: npm run build:content

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (xvfb)
        run: xvfb-run npx playwright test
