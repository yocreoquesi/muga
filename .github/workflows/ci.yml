name: CI

# Run tests on every pull request to main or to the dev integration branch,
# and on every push to main. Pushes to dev are covered by the PR gate above;
# the push trigger stays main-only so the live Worker contract tests (which
# reach the network) run at a single, predictable point.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check JS (tsc --checkJs) (#823)
        run: npm run typecheck

      - name: Lint JS (ESLint flat config) (#823)
        run: npm run lint:js

      - name: Compile rules artifacts (#626)
        run: npm run compile:rules

      - name: Generate wrapper DNR rules (#708)
        run: npm run build:dnr

      - name: Check src/rules/ is up to date (#626 + #708)
        # Asserts every generated rules artifact matches its committed form.
        # Covers tracking-params.json, rules-manifest.json (compile:rules) AND
        # wrapper-dnr-rules.json (build:dnr) — any drift between source and
        # committed artifact fails CI loudly. Both generators are byte-
        # deterministic, so a clean diff is always achievable.
        run: |
          if ! git diff --exit-code -- src/rules/; then
            echo "ERROR: src/rules/ artifacts are out of sync with their source."
            echo "Run 'npm run compile:rules' and 'npm run build:dnr' locally and commit the result."
            exit 1
          fi

      - name: Bundle content script (#356)
        run: npm run build:content

      - name: Check content bundle is up to date
        run: |
          if ! git diff --exit-code src/content/cleaner-bundle.js; then
            echo "ERROR: cleaner-bundle.js is out of sync with its source. Run 'npm run build:content' and commit the result."
            exit 1
          fi

      - name: Refresh web engine + landing mirror (#1029)
        run: npm run build:web

      - name: Check web engine + landing mirror are up to date (#1029)
        # web/engine/cleaner-bundle.js + web/engine/domain-rules.json are
        # generated byte copies of src/content/cleaner-bundle.js and
        # src/rules/domain-rules.json; the whole web/ tree is then mirrored
        # into landing/clean/ for deploy (see design ADR-2). Same drift-gate
        # pattern as the content-bundle check above, applied to both
        # committed locations.
        run: |
          if ! git diff --exit-code -- web/engine landing/clean; then
            echo "ERROR: web/ engine copy or landing/clean mirror out of sync. Run 'npm run build:web' and commit."
            exit 1
          fi

      - name: Check web/src dependency-direction boundary (#1029)
        # Mechanically enforces the one-way boundary: web/ (and landing/clean/)
        # must never import from src/, and src/ must never import from web/ or
        # landing/clean/ — see design ADR-3.
        run: npm run check:web-boundary

      - name: Verify browser-polyfill integrity (#97)
        run: node tools/verify-polyfill-integrity.mjs

      - name: Verify rule-ingestion quarantine (#772)
        # Clean-room gate: raw upstream signals must never be committed or
        # bundled. Fails CI if anything is tracked under the quarantine dir,
        # if the path drops out of .gitignore, or if it moves under src/.
        run: npm run verify:quarantine

      - name: Check i18n quality (no FIXME / stubs / empty locale slots) (#621)
        run: npm run check:i18n

      - name: Community locale parity report (#990)
        # Non-blocking: pt/de/fr/it/ja are community-maintained and allowed to
        # have gaps (missing keys degrade to the EN string at runtime — see
        # src/lib/i18n.js's t() fallback). This step surfaces the gap in the
        # job summary for contributors; it must never fail the build. The
        # tool always exits 0 when called with no args, and continue-on-error
        # is the second line of defense against a hard crash.
        continue-on-error: true
        run: |
          {
            echo "## Community locale translation parity (#990)"
            echo ""
            node tools/missing-translations.mjs
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: npm test

      - name: Run integration tests — stub only on PRs (#608, #825)
        # On pull_request: runs the stub/local integration suite only
        # (tests/integration/*.test.mjs). Live Worker tests (tests/integration/live/)
        # are excluded so transient unwrap.muga.app / CDN hiccups cannot hard-fail
        # unrelated contributor PRs (#825). Stub coverage already validates the
        # extension-Worker contract shape (path, param schema, affiliate flow).
        #
        # On push to main: ALSO runs the live Worker contract tests with
        # MUGA_LIVE_TESTS=1 — contract drift is visible where it belongs, on the
        # integration branch, without blocking PR authors (#825/#701).
        #
        # Decommission path (#701): when unwrap.muga.app is retired, delete
        # tests/integration/live/ and remove the live step below. The stub step
        # and test:integration:stub script need no changes.
        if: github.event_name == 'pull_request'
        run: npm run test:integration:stub

      - name: Run integration tests — full suite incl. live Worker on main pushes (#608, #825)
        if: github.event_name == 'push'
        env:
          MUGA_LIVE_TESTS: "1"
        run: npm run test:integration

      - name: CAPS-Contextual conformance gate (#543)
        run: npm run conformance:contextual

      - name: Lint extension
        run: npm run lint

  coverage:
    # Non-blocking: runs only on push to main so coverage overhead does not
    # slow the PR gate. Upload the text report as an artifact for baseline
    # tracking. No threshold gate yet — establish baseline first (#822).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          # Node 22 required here: --test-coverage-exclude landed in 22.5
          # (running it on Node 20 exits 9 "invalid argument"). The rest of
          # CI stays on the project's Node 20 floor.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        # --experimental-test-coverage instruments all loaded source files.
        # The coverage summary is captured (spec + coverage table) to a text
        # file. `|| true` (NOT `; exit 0`) — under `bash -e` a failing npm
        # would abort the list before ever reaching `exit 0`.
        run: npm run test:coverage > coverage.txt 2>&1 || true

      - name: Upload coverage report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bundle content script (#356)
        run: npm run build:content

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (xvfb)
        run: xvfb-run npx playwright test
