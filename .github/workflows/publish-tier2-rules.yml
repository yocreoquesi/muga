name: publish-tier2-rules

# Triggered on push to main that changes the unsigned Tier2 rules source.
# Signs the source with the Ed25519 key stored in the SAME MUGA_SIGNING_KEY
# repository secret already used for params.json (REVISED ADR-6 — shared
# key, no separate Tier2 secret), commits the signed
# docs/rules/v1/tier2.json back to main, and smoke-checks the published URL.
#
# No new secret is required — MUGA_SIGNING_KEY already exists for
# publish-rules.yml. This workflow adds ONE MORE signing step for the Tier2
# payload, not a parallel key/pipeline.
#
# Scoped to tools/rules-source/tier2.json only (not the tools/rules-source/**
# glob) so a params-only merge doesn't trigger a redundant Tier2 sign job.
on:
  push:
    branches:
      - main
    paths:
      - "tools/rules-source/tier2.json"

# Default to least privilege. The publish job elevates to contents: write.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Elevated to write so we can push the publish branch; pull-requests:write
    # so the PAT-driven `gh pr create/merge` can open + auto-merge the PR.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Direct push to protected main is rejected (GH006) — same as params.
          # Publish via a PR using MUGA_PR_TOKEN (the fine-grained PAT already
          # used by auto-ingest-rules.yml): it triggers ci.yml and can auto-merge
          # past branch protection. No new secret.
          token: ${{ secrets.MUGA_PR_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write signing key to temp file and mask it
        # Writes the private key PEM to a temp file in RUNNER_TEMP (not the
        # workspace) — the SAME key used by publish-rules.yml for params.json.
        # Immediately masks the value so any accidental echo is redacted in logs.
        # SECURITY: never echo $MUGA_SIGNING_KEY directly — use the file path only.
        env:
          MUGA_SIGNING_KEY: ${{ secrets.MUGA_SIGNING_KEY }}
        run: |
          echo "$MUGA_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          while IFS= read -r line; do echo "::add-mask::$line"; done < "$RUNNER_TEMP/key.pem"

      - name: Sign Tier2 rules source
        env:
          MUGA_SIGNING_KEY_PATH: ${{ runner.temp }}/key.pem
        run: node tools/sign-tier2-rules.mjs

      - name: Clean up signing key
        # Always runs — even if previous steps fail — so the key is never left on disk.
        if: always()
        run: rm -f "$RUNNER_TEMP/key.pem"

      - name: Open PR with the signed artifact
        # Mirrors auto-ingest-rules.yml: a params/tier2 artifact reaches protected
        # main via a PR (never a direct push). The signed docs/rules/v1/tier2.json
        # is a deterministic function of the already-reviewed source, so auto-merge
        # after ci.yml passes is safe. GitHub Pages (docs/CNAME = rules.muga.app)
        # then serves it at https://rules.muga.app/rules/v1/tier2.json — no
        # separate endpoint deploy exists or is needed.
        env:
          GH_TOKEN: ${{ secrets.MUGA_PR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1/tier2.json
          if git diff --cached --quiet; then
            echo "No changes to docs/rules/v1/tier2.json — nothing to publish."
            exit 0
          fi
          BRANCH="publish-tier2/${GITHUB_SHA::12}"
          git checkout -B "$BRANCH"
          # NO [skip ci]: the PR needs ci.yml's required checks to pass so branch
          # protection is satisfied and `--auto` merge can complete.
          git commit -m "ci(rules): publish signed tier2.json"
          git push -u origin "$BRANCH" --force-with-lease
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — leaving it."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "ci(rules): publish signed tier2.json" \
              --body "Automated signed publish of \`docs/rules/v1/tier2.json\` from \`tools/rules-source/tier2.json\`, signed by publish-tier2-rules.yml with the shared MUGA_SIGNING_KEY. GitHub Pages serves it at https://rules.muga.app/rules/v1/tier2.json."
            gh pr merge "$BRANCH" --squash --auto
          fi
