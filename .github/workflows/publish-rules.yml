name: publish-rules

# Triggered on push to main that changes the unsigned rules source.
# Signs the source with the Ed25519 key stored in MUGA_SIGNING_KEY secret,
# commits the signed docs/rules/v1/params.json back to main, and smoke-checks
# the GitHub Pages URL after publication.
#
# Action required before first run:
#   Upload the Ed25519 private key as the MUGA_SIGNING_KEY repository secret.
#   See the PR body for the exact command.
on:
  push:
    branches:
      - main
    paths:
      - "tools/rules-source/**"
      # The publish PR's own merge re-enters here. Signing is deterministic
      # (Ed25519, same source, same key), so that pass finds nothing to publish
      # and becomes the run that smoke-checks the live endpoint.
      - "docs/rules/v1/params.json"

# Default to least privilege. The publish job elevates to contents: write.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Elevated to write so the publish branch can be pushed.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # MUGA_PR_TOKEN, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN does
          # not trigger ci.yml (GitHub's recursion guard), so its required
          # checks never run and `--auto` merge can never complete.
          token: ${{ secrets.MUGA_PR_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write signing key to temp file and mask it
        # Writes the private key PEM to a temp file in RUNNER_TEMP (not the workspace).
        # Immediately masks the value so any accidental echo is redacted in logs.
        # SECURITY: never echo $MUGA_SIGNING_KEY directly — use the file path only.
        env:
          MUGA_SIGNING_KEY: ${{ secrets.MUGA_SIGNING_KEY }}
        run: |
          echo "$MUGA_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          while IFS= read -r line; do echo "::add-mask::$line"; done < "$RUNNER_TEMP/key.pem"

      - name: Sign rules source
        env:
          MUGA_SIGNING_KEY_PATH: ${{ runner.temp }}/key.pem
        run: node tools/sign-rules.mjs

      - name: Clean up signing key
        # Always runs — even if previous steps fail — so the key is never left on disk.
        if: always()
        run: rm -f "$RUNNER_TEMP/key.pem"

      # Publishes through a PULL REQUEST, not a push to main.
      #
      # The direct push this replaced could never work: main is protected
      # ("Changes must be made through a pull request"), so the push is rejected
      # with GH006. It went unnoticed for months because the signed artifact is
      # normally committed INSIDE the auto-ingest PR, which left this workflow
      # with nothing to push and a green "No changes" every time. The first run
      # that had real work to do failed (#1250).
      #
      # NO [skip ci]: the PR needs ci.yml to run so branch protection's required
      # checks pass and `--auto` can merge. [skip ci] leaves the PR blocked
      # forever. Same reasoning as auto-ingest-rules.yml.
      - name: Publish signed artifact via pull request
        id: publish
        env:
          GH_TOKEN: ${{ secrets.MUGA_PR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1/params.json

          if git diff --cached --quiet; then
            echo "No changes to docs/rules/v1/params.json — already published."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d-%H%M)
          BRANCH="publish-rules/$DATE"
          git checkout -B "$BRANCH"
          git commit -m "ci(rules): publish signed params.json"
          git push -u origin "$BRANCH" --force-with-lease

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "ci(rules): publish signed params.json ($DATE)" \
              --body "Signed by publish-rules.yml from tools/rules-source/params.json. Generated by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label "category:ops"
          fi
          gh pr merge "$BRANCH" --squash --auto --delete-branch
          echo "published=true" >> "$GITHUB_OUTPUT"

  smoke-check:
    runs-on: ubuntu-latest
    needs: publish
    # Only when this run had nothing to publish, which means the live endpoint
    # should already match what is committed. A run that OPENED a PR cannot be
    # smoke-checked here: `--auto` merges minutes later, after required checks.
    # That PR's merge re-enters this workflow via the docs/ path above, and that
    # pass is the one that verifies the endpoint.
    if: needs.publish.outputs.published == 'false'
    # Allow some propagation delay — GitHub Pages can take a minute after push.
    steps:
      # Needed to compare the live payload against the one this repository
      # committed. Without a checkout the job can only ask "does the URL
      # answer?", which is the gap this step closes.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Wait for GitHub Pages propagation
        # Brief initial pause to let the push reach Pages CDN before retrying.
        run: sleep 30

      # Fetches the BODY and compares it to docs/rules/v1/params.json.
      #
      # This was `curl --head` (#1267), which asked only whether the URL
      # answered at all. A publish that landed a broken or stale payload passed
      # its own smoke check by construction: a 200 on the wrong bytes looks
      # exactly like a 200 on the right ones. This is the check that should
      # have caught #1251, where the workflow published nothing for months.
      #
      # `sig` is the strongest single field to compare: it is the Ed25519
      # signature over the payload, so an equal sig means the endpoint serves
      # the exact bytes this repository signed. `version` is compared too,
      # because it is the field a human reads during an incident.
      #
      # --fail exits non-zero on HTTP 4xx/5xx (including 404 during propagation).
      # --retry-all-errors retries on transient HTTP errors (not just network errors).
      # --retry 3 with --retry-delay 30 tolerates up to ~120s of propagation lag.
      - name: Verify the live endpoint serves the committed payload
        run: |
          set -euo pipefail
          curl --fail \
               --silent \
               --show-error \
               --retry 3 \
               --retry-delay 30 \
               --retry-all-errors \
               -o "$RUNNER_TEMP/live-params.json" \
               https://rules.muga.app/rules/v1/params.json
          node tools/verify-published-params.mjs \
               --live "$RUNNER_TEMP/live-params.json" \
               --committed docs/rules/v1/params.json
