name: AdGuard global candidates — monthly report

# Automates issue #1463's Area 5 gap: new GLOBAL params AdGuard Filter 17
# adds upstream are no longer detected on a schedule (the previous path,
# import-upstream.yml, was deliberately switched to on-demand-only after
# #1303 — a recurring PR that adds candidates straight to TRACKING_PARAMS is
# unsafe, since a param there has no urlFilter and strips on every site).
#
# This runs the same measurement (tools/adguard-global-candidates.mjs) on a
# schedule and surfaces the result as ONE deduplicated tracking issue,
# mirroring anchored-only-globals.yml's (#1228) pattern exactly. It NEVER
# opens a PR and NEVER edits TRACKING_PARAMS — removal (landing) always
# needs a human to check vendor evidence and collision risk (see the issue
# body's own triage steps, mirrored from #1463 Area 1's method).

on:
  schedule:
    # 1st of the month, 10:00 UTC — 2 h after anchored-only-globals
    # (0 8 1 * *), itself 2 h after moat-expansion (0 6 1 * *), itself 2 h
    # after import-upstream (0 4 1 * *), so none of the four monthly
    # maintenance jobs collide.
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Concurrency: only one run in flight; queued, no cancellation.
concurrency:
  group: adguard-global-candidates
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      # One definition for both steps, so a rename cannot desync them.
      REPORT_PATH: ${{ github.workspace }}/adguard-global-candidates-report.json
      ISSUE_BODY_PATH: ${{ github.workspace }}/adguard-global-candidates-issue.md
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # No later step needs git credentials; keep the issues:write token
          # out of the git config that npm ci's lifecycle scripts can read.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run adguard-global-candidates report
        id: report
        env:
          ADGUARD_GLOBAL_REPORT_PATH: ${{ env.REPORT_PATH }}
          ADGUARD_GLOBAL_ISSUE_BODY_PATH: ${{ env.ISSUE_BODY_PATH }}
        run: |
          set -eo pipefail
          # A network/fetch failure here throws and exits non-zero (see
          # tools/adguard-global-candidates.mjs's main().catch) — this step
          # must fail loudly, never fall through to a "0 candidates" read.
          npm run adguard-global-candidates-report
          # jq -e fails on a missing/null field; the integer check refuses
          # anything else, so a malformed report can never read as a count.
          COUNT=$(jq -e -r '.candidate_count' "$REPORT_PATH")
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::candidate_count is not a non-negative integer: $COUNT"
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Candidates discovered: $COUNT"

      - name: Open, update, or resolve the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COUNT: ${{ steps.report.outputs.count }}
          BODY_PATH: ${{ env.ISSUE_BODY_PATH }}
        run: |
          set -euo pipefail

          TITLE="AdGuard global candidates: new unreviewed TRACKING_PARAMS additions (#1463)"

          # One open tracking issue, matched by exact title (same dedupe
          # convention as anchored-only-globals.yml / alert-on-failure.yml).
          NUM="$(gh issue list --repo "$REPO" --state open --search '"AdGuard global candidates" in:title' --limit 50 --json number,title \
                 | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')"

          if [ "$COUNT" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --repo "$REPO" --body "Re-measured $(date -u +%Y-%m-%d): 0 candidates. Every current AdGuard global name is now covered or adjudicated. Auto-closing."
              gh issue close "$NUM" --repo "$REPO" --reason completed
            else
              echo "No candidates this run and no open tracking issue — nothing to do."
            fi
            exit 0
          fi

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body-file "$BODY_PATH"
            gh issue comment "$NUM" --repo "$REPO" --body "Re-measured $(date -u +%Y-%m-%d): $COUNT candidate(s). Issue body updated above."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_PATH" --label "needs-triage,category:ops"
          fi
