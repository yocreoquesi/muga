name: Moat expansion — weekly affiliate-param discovery

on:
  schedule:
    # Sunday 06:00 UTC — 2 h after import-upstream (0 4 * * 0) so the two
    # weekly jobs do not collide.  Off-peak arrival at the start of the
    # maintainer's week.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Concurrency: only one moat-expansion run in flight; queued, no cancellation.
concurrency:
  group: moat-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Run moat expansion report
        id: report
        run: |
          set -eo pipefail
          npm run moat:report
          # Detect whether any report was written this run (no report = no gaps)
          REPORT_FILE=$(ls tools/moat-expansion/reports/report-*.md 2>/dev/null | sort | tail -n 1 || true)
          if [ -z "$REPORT_FILE" ]; then
            echo "gap_count=0" >> "$GITHUB_OUTPUT"
          else
            echo "gap_count=1" >> "$GITHUB_OUTPUT"
            echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early if no new gaps
        if: steps.report.outputs.gap_count == '0'
        run: echo "No new gaps found this week — moat is current. Exiting cleanly."

      - name: Configure git for the bot commit
        if: steps.report.outputs.gap_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit report
        if: steps.report.outputs.gap_count != '0'
        id: branch
        run: |
          set -eo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="moat-expansion/$DATE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # If a branch from a previous failed run exists, recreate from main.
          git checkout -B "$BRANCH"

          # Reports are gitignored (see .gitignore) so they never reach main via a
          # direct push; force-add the archival copy so it lands on the bot branch.
          git add -f "${{ steps.report.outputs.report_file }}"
          git commit -m "auto-moat: affiliate-param gap report ($DATE)"
          git push -u origin "$BRANCH" --force-with-lease

      - name: Open or update pull request
        if: steps.report.outputs.gap_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          DATE="${{ steps.branch.outputs.date }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          REPORT="${{ steps.report.outputs.report_file }}"

          REPORT_BODY=$(cat "$REPORT")

          BODY=$(cat <<EOF
          Weekly automated moat-expansion diff against [ClearURLs data.min.json](https://gitlab.com/ClearURLs/Rules/-/raw/master/data.min.json) (LGPL-3.0, signals-not-copies).

          **Fetched at:** $DATE
          **Raw file:** quarantined in \`tools/moat-expansion/quarantine/\` (gitignored — not committed)

          ## Gap Report

          $REPORT_BODY

          ## Reviewer checklist

          - [ ] Review each gap in the **new-param-on-known-program** section and confirm the param is a real affiliate signal
          - [ ] For each confirmed gap: copy the draft manifest entry and add it to \`CAPS_DIRECT_INJECTION_PROGRAMS\` in \`src/rules/manifest.data.js\`
          - [ ] Review each entry in the **unknown-provider** section; add to \`tools/moat-expansion/lookup-table.mjs\` if the provider is a known affiliate network
          - [ ] Run \`npm run build:rules\` to regenerate the DNR ruleset after any manifest changes
          - [ ] Run \`npm run build:content\` to regenerate the content-script bundle
          - [ ] Once triaged, delete \`$REPORT\`

          **DO NOT auto-merge.** Each gap entry requires human judgment to confirm
          it is a real affiliate signal (not a functional parameter) before it is
          added to the moat.

          The full report is committed to this branch at \`$REPORT\` for archival.
          EOF
          )

          # Write body to a temp file to avoid shell-injection via $BODY.
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"

          # Re-use existing PR if one is already open against this branch.
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "[moat-expansion] affiliate-param gap report ($DATE)" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "[moat-expansion] affiliate-param gap report ($DATE)" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "needs-triage,category:ops"
          fi
