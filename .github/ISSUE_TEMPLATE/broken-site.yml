name: Site broken by MUGA
description: Report a site that stopped working after MUGA cleaned a URL.
title: "[Broken] "
labels: ["broken-site", "bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The "Report this page" button in the MUGA popup and
        Settings > Report a problem both open this form prefilled, including the full page
        URL and a snapshot of your MUGA settings. Nothing is published until you click
        Submit: review every field first and remove anything personal or sensitive
        (tokens, emails, account IDs).
  - type: input
    id: hostname
    attributes:
      label: Domain
      description: Hostname only (e.g. `example.com`). No paths, no query strings.
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What stopped working?
      description: One or two sentences. e.g. "Search results don't load", "Login redirects in a loop".
      placeholder: Describe the broken behaviour after MUGA cleaned the URL.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Full page URL
      description: >-
        Check this URL has no personal data before submitting. Remove or edit
        tokens, emails, account IDs or anything else private, or clear the field
        if the domain alone is enough.
      placeholder: https://example.com/path?query=...
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Chrome / Firefox / Edge / etc., plus version if known.
      placeholder: Firefox 130
  - type: input
    id: version
    attributes:
      label: MUGA version
      description: Visible in `chrome://extensions` or `about:addons`. The extension's report prefills it automatically.
      placeholder: 3.2.0
  - type: input
    id: action
    attributes:
      label: Action MUGA took (auto-filled)
      description: What MUGA did to this page's URL, e.g. `cleaned` or `untouched`. Leave blank if it was not prefilled.
      placeholder: cleaned
  - type: textarea
    id: params
    attributes:
      label: Params MUGA removed (if known)
      description: Comma-separated list. Leave blank if unknown.
      placeholder: utm_source, fbclid
  - type: textarea
    id: scoped
    attributes:
      label: Host-scoped params (auto-filled)
      description: >-
        Params MUGA applies only on this host, from its host-anchored rules.
        Prefilled by the extension. These are the first suspects when a site
        stops working, because each was admitted on one upstream source's word
        for this host alone. Leave blank if it was not prefilled.
      placeholder: _r, igsh
  - type: textarea
    id: settings
    attributes:
      label: Settings (auto-filled)
      description: >-
        Your MUGA settings that differ from the defaults, so the problem can be
        reproduced. Lists appear as entry counts, plus only the entries that
        match this page. Leave blank if it was not prefilled.
      placeholder: "Remote rules: on, payload version 16"
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I checked the URL, settings and every other field above, and they contain no personal or sensitive data (no tokens, emails, or account IDs).
          required: true
