name: Site broken by MUGA
description: Report a site that stopped working after MUGA cleaned a URL.
title: "[Broken] "
labels: ["broken-site", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. You may include the full page URL below if it helps reproduce
        the problem, but first confirm it has no personal or sensitive data (tokens, emails,
        account IDs). Hostname alone is also fine and is the default from the popup / options
        report buttons unless you explicitly opt in to sharing the full URL.
  - type: input
    id: hostname
    attributes:
      label: Domain
      description: Hostname only (e.g. `example.com`). No paths, no query strings.
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What stopped working?
      description: One or two sentences. e.g. "Search results don't load", "Login redirects in a loop".
      placeholder: Describe the broken behaviour after MUGA cleaned the URL.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Chrome / Firefox / Edge / etc., plus version if known.
      placeholder: Firefox 130
  - type: input
    id: version
    attributes:
      label: MUGA version
      description: Visible in `chrome://extensions` or `about:addons`. The popup prefill includes it automatically.
      placeholder: 1.13.2
  - type: textarea
    id: params
    attributes:
      label: Params MUGA removed (if known)
      description: Comma-separated list. Leave blank if unknown.
      placeholder: utm_source, fbclid
  - type: input
    id: url
    attributes:
      label: Full page URL (optional)
      description: Only if it helps reproduce the problem. Omit any personal or sensitive data (tokens, emails, account IDs) before pasting.
      placeholder: https://example.com/path?query=...
    validations:
      required: false
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I confirm any URL or details I've included contain no personal or sensitive data (no tokens, emails, or account IDs).
          required: true
